services:
  codex-web:
    image: ghcr.io/mzmrk/codex-web:latest
    container_name: codex-web
    restart: unless-stopped
    init: true

    environment:
      CODEX_PASSWORDLESS_SUDO: false
      PGID: 1000
      PUID: 1000

    volumes:
      - ./workspace:/home/node/Documents
      - ./codex-auth:/home/node/.codex

    networks:
      - codex-web-private

  caddy:
    image: caddy:2-alpine
    container_name: codex-web-caddy
    restart: unless-stopped
    depends_on:
      - codex-web

    environment:
      CADDY_HOST: "localhost"
      CADDY_USERNAME: "codex"

      # Default password: CHANGEME
      # To change it, replace NEW_PASSWORD, run this command, and paste its output below:
      # docker run --rm caddy:2-alpine sh -c "caddy hash-password --plaintext NEW_PASSWORD | sed 's/[$]/&&/g'"
      CADDY_PASSWORD_HASH: "$$2a$$14$$p6HAYNIHJiCqNMC5NmHoKO490zl4bYX84Gdq8kKoKiwKmNXjAD73y"

      CADDY_CONFIG: |
        {
          default_sni {$$CADDY_HOST}
        }
        https://{$$CADDY_HOST}:8214 {
          tls /certs/codex.crt /certs/codex.key
          basic_auth {
            {$$CADDY_USERNAME} {$$CADDY_PASSWORD_HASH}
          }
          reverse_proxy codex-web:8214
        }

    entrypoint: ["/bin/sh", "-eu", "-c"]

    command:
      - |
        cert=/certs/codex.crt
        key=/certs/codex.key

        if [ ! -s "$$cert" ] || [ ! -s "$$key" ]; then
          case "$$CADDY_HOST" in
            *:*) san="IP:$$CADDY_HOST" ;;
            *[!0-9.]*) san="DNS:$$CADDY_HOST" ;;
            *) san="IP:$$CADDY_HOST" ;;
          esac

          openssl req \
            -x509 \
            -newkey rsa:3072 \
            -sha256 \
            -days 3650 \
            -nodes \
            -keyout "$$key" \
            -out "$$cert" \
            -subj "/CN=$$CADDY_HOST" \
            -addext "subjectAltName=$$san" \
            -addext "basicConstraints=critical,CA:FALSE" \
            -addext "keyUsage=critical,digitalSignature,keyEncipherment" \
            -addext "extendedKeyUsage=serverAuth"

          chmod 0600 "$$key"
          chmod 0644 "$$cert"
        fi

        printf '%s' "$$CADDY_CONFIG" > /etc/caddy/Caddyfile
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile

    ports:
      - "8214:8214"

    volumes:
      - caddy-data:/data
      - caddy-config:/config
      - caddy-certs:/certs

    networks:
      - codex-web-private

networks:
  codex-web-private:

volumes:
  caddy-certs:
  caddy-config:
  caddy-data:
